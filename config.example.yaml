# DeepSeek 示例配置。复制为 config.yaml 后使用。
protocol: deepseek
model: deepseek-v4-pro
base_url: https://api.deepseek.com
api_key: ${DEEPSEEK_API_KEY}
context_window_tokens: 128000

# 可选。未配置时分别默认为 8000 和 16000。
tool_result_threshold_tokens: 8000
tool_batch_threshold_tokens: 16000

# 子 Agent 委派。模型档位只映射当前 Provider 的模型 ID；可按需省略未使用档位。
agents:
  model_aliases:
    haiku: fast-model-id
    sonnet: balanced-model-id
    opus: strongest-model-id
  background_allowed_tools:
    - read_file
    - find_files
    - search_code
    - read_git_changes
  foreground_timeout_seconds: 30
  task_wait_timeout_seconds: 30
  task_wait_max_seconds: 300
  shutdown_timeout_seconds: 5
  max_concurrency: 4
  max_queue_size: 32
  inbox_preview_chars: 8000
  # 仅定义式角色可用 isolation: worktree。根目录固定为
  # <repo>/.mycode/worktrees/，不接受 LLM 或配置指定路径。
  worktree:
    git_timeout_seconds: 10
    cleanup_interval_seconds: 300
    stale_after_seconds: 86400
    copy_max_files: 10000
    copy_max_bytes: 104857600
    initialization:
      - action: copy
        source: config.yaml
        target: config.yaml
        required: false
      - action: copy
        source: .mycode/permissions.local.yaml
        target: .mycode/permissions.local.yaml
        required: false
      - action: copy
        source: .mycode/hooks.local.yaml
        target: .mycode/hooks.local.yaml
        required: false
      - action: symlink
        source: .venv
        target: .venv
        required: false
      - action: hooks
        source: .git/hooks
        required: false

# 长期团队协作。团队元数据固定持久化到 ~/.mycode/teams/<team>/，不写入仓库。
# 后端 auto 优先 tmux；tmux 不可用时会明确报告原因并降级到 coroutine。
teams:
  max_members: 8
  max_tasks: 1000
  max_dependencies_per_task: 32
  max_message_chars: 20000
  message_summary_chars: 240
  mailbox_batch_size: 50
  max_mailbox_bytes: 52428800
  max_context_bytes: 104857600
  max_work_log_entries: 1000
  lock_timeout_seconds: 5
  shutdown_timeout_seconds: 5
  backend_start_timeout_seconds: 10
  integration_timeout_seconds: 300
  # 模型只能引用命令 ID，不能修改 argv。命令始终通过 shell=false 执行。
  verification_commands:
    - id: unit-tests
      argv: [.venv/bin/python, -m, pytest, -q]
      timeout_seconds: 300
  # Coordinator 默认关闭。这里开启只是第一把锁；启动进程时还必须显式设置
  # MEWCODE_COORDINATOR=1，两个条件同时满足才会收缩 Lead 工具面。
  coordinator:
    enabled: false

# Agent 角色位于项目 .mycode/agents/ 或用户 ~/.mycode/agents/；内置角色与
# 由宿主注入的插件目录优先级更低。后台 allowlist 只能收紧执行面，不能放开
# Agent、Task、load_skill 等全局禁止项，也不能跳过角色、Plan 或权限规则。
# Worktree 初始化只允许安全相对路径和 copy/symlink/hooks，不执行脚本或安装依赖。
# required 源缺失会阻止任务；可选源缺失只产生脱敏诊断。后台清理只读取本地
# Git 引用，不执行 fetch、push、merge、rebase，也不会强制删除受保护改动。

# OpenAI 示例：
# protocol: openai
